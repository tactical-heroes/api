name: CI

on:
  pull_request:
  push:
    branches: [ main, development ]
    paths-ignore:
      - deploy/helm/**/images-*.yaml

jobs:
  format:
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-format.yml@main
    secrets:
      registry-user: ${{ secrets.REGISTRY_USER }}
      registry-token: ${{ secrets.REGISTRY_TOKEN }}

  tests:
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-tests.yml@main
    secrets:
      registry-user: ${{ secrets.REGISTRY_USER }}
      registry-token: ${{ secrets.REGISTRY_TOKEN }}

  sonar:
    needs: tests
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-sonar.yml@main
    with:
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
      registry-user: ${{ secrets.REGISTRY_USER }}
      registry-token: ${{ secrets.REGISTRY_TOKEN }}

  sonar-report:
    if: ${{ always() && (needs.sonar.result == 'success' || needs.sonar.result == 'failure') }}
    needs: sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report Sonar quality gate conditions
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BRANCH: ${{ github.ref_name }}
          SONAR_PR: ${{ github.event.pull_request.number }}
          SONAR_BASE: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail

          selectors=("branch=$SONAR_BRANCH")
          if [[ -n "$SONAR_PR" ]]; then
            selectors=("pullRequest=$SONAR_PR" "branch=$SONAR_BASE")
          fi

          for selector in "${selectors[@]}"; do
            echo "Quality gate: $selector"
            status=$(curl --fail --silent --show-error --max-time 60 \
              --header "Authorization: Bearer $SONAR_TOKEN" \
              --get "${SONAR_HOST_URL%/}/api/qualitygates/project_status" \
              --data-urlencode "projectKey=$SONAR_PROJECT_KEY" \
              --data-urlencode "$selector")
            jq '.projectStatus' <<< "$status"
            {
              echo "### Sonar quality gate: $selector"
              echo '```json'
              jq '.projectStatus' <<< "$status"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "$(jq -r '.projectStatus.status' <<< "$status")" == "ERROR" ]]; then
              curl --fail --silent --show-error --max-time 60 \
                --header "Authorization: Bearer $SONAR_TOKEN" \
                --get "${SONAR_HOST_URL%/}/api/issues/search" \
                --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
                --data-urlencode "$selector" \
                --data-urlencode 'resolved=false' \
                --data-urlencode 'ps=100' \
                | jq '{total, issues: [.issues[] | {rule, component, line, message}]}'
            fi
          done

  helm:
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/helm-validation.yml@main
    with:
      chart-repository: PANiXiDA-Infrastructure/ci-cd
      chart-ref: main
      helm-chart-path: charts/application
      values-path: ${{ vars.HELM_VALUES_PATH }}
      common-values-file: ${{ vars.HELM_COMMON_VALUES_FILE }}
      development-release-name: ${{ vars.HELM_DEVELOPMENT_RELEASE_NAME }}
      production-release-name: ${{ vars.HELM_PRODUCTION_RELEASE_NAME }}

  resolve-env:
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'development') }}
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/resolve-environment.yml@main

  build-api:
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'development') }}
    needs: [ format, tests, sonar, helm, resolve-env ]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/docker-build.yml@main
    with:
      service-folder: ${{ vars.SERVICE_FOLDER }}
      image: |
        ${{ vars.REGISTRY_IMAGE_PREFIX }}/${{ vars.SERVICE_NAME }}:${{ github.run_number }}
        ${{ vars.REGISTRY_IMAGE_PREFIX }}/${{ vars.SERVICE_NAME }}:${{ needs.resolve-env.outputs.environment }}-${{ github.run_number }}
    secrets:
      registry-user: ${{ secrets.REGISTRY_USER }}
      registry-token: ${{ secrets.REGISTRY_TOKEN }}

  build-migrator:
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'development') }}
    needs: [ format, tests, sonar, helm, resolve-env ]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/docker-build.yml@main
    with:
      service-folder: ${{ vars.MIGRATOR_FOLDER }}
      image: |
        ${{ vars.REGISTRY_IMAGE_PREFIX }}/${{ vars.MIGRATOR_NAME }}:${{ github.run_number }}
        ${{ vars.REGISTRY_IMAGE_PREFIX }}/${{ vars.MIGRATOR_NAME }}:${{ needs.resolve-env.outputs.environment }}-${{ github.run_number }}
    secrets:
      registry-user: ${{ secrets.REGISTRY_USER }}
      registry-token: ${{ secrets.REGISTRY_TOKEN }}

  notify:
    if: ${{ always() && github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'development') }}
    needs: [ build-api, build-migrator ]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/notify-telegram.yml@main
    with:
      event-name: ${{ github.event_name }}
    secrets:
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
      github-token: ${{ secrets.REGISTRY_TOKEN }}
